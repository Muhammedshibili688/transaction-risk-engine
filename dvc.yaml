stages:
  ingestion:
    cmd: python src/components/data/data_ingestion.py
    outs:
      - datas/raw/train_snapshot.parquet:
          cache: false    # ← stops DVC restoring bad cached version
    always_changed: true

  data_validation:
    cmd: python src/components/data/data_validation.py
    deps:
      - datas/raw/train_snapshot.parquet
      - src/components/data/data_validation.py
      - config/schema.yaml
    outs:
      - reports/data_validation/status.yaml

  heuristic_analysis:
    cmd: python src/pipeline/experiment_pipeline.py --data datas/raw/train_snapshot.parquet
    deps:
      - datas/raw/train_snapshot.parquet
      - config/rules/baseline.yaml
      - src/components/model/scorer.py
    outs:
      - reports/metrics.json:
          cache: false

  scoring:
    cmd: python scoring_runner.py --data datas/raw/train_snapshot.parquet
    deps:
      - datas/raw/train_snapshot.parquet
      - config/rules/baseline.yaml
    outs:
      - datas/scoring:
          cache: false    # ← add this too

  evaluation:
    cmd: python evaluation_runner.py --data datas/raw/train_snapshot.parquet
    deps:
      - datas/raw/train_snapshot.parquet
      - datas/scoring/latest.jsonl
      - evaluation_runner.py
      - src/pipeline/evaluation_pipeline.py
    outs:
      - reports/model_evaluation:
          cache: false

  # threshold_optimization:
  #   cmd: python threshold_runner.py --data datas/raw/train_snapshot.parquet
  #   deps:
  #     - datas/raw/train_snapshot.parquet
  #   outs:
  #     - reports/threshold_optimization/best_threshold.yaml:
  #         cache: false

  threshold_optimization:
    cmd: python threshold_runner.py --data datas/raw/train_snapshot.parquet
    deps:
      - datas/raw/train_snapshot.parquet
      - datas/scoring/latest.jsonl          # ← add this
      - threshold_runner.py
    outs:
      - reports/threshold_optimization/best_threshold.yaml:
          cache: false